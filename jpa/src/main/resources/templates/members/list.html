<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 관리 시스템</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 12px; text-align: left; }
        th { background-color: #f8f9fa; }
        .btn { padding: 8px 12px; text-decoration: none; border-radius: 4px; font-size: 14px; }
        .btn-add { background-color: #28a745; color: white; float: right; }
        .btn-edit { background-color: #ffc107; color: black; margin-right: 5px; }
        .btn-delete { background-color: #dc3545; color: white; }
        .container { max-width: 1000px; margin: auto; }
    </style>
</head>
<body>

<div class="container">
    <h2>👥 회원 관리 목록 (CRUD 확인)</h2>

    <a th:href="@{/members/new}" class="btn btn-add">+ 신규 회원 등록</a>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>이름</th>
            <th>나이</th>
            <th>주소</th>
            <th>전화번호</th>
            <th>관리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="member : ${memberList}">
            <td th:text="${member.memberId}">1</td>
            <td th:text="${member.name}">홍길동</td>
            <td th:text="${member.age}">25</td>
            <td th:text="${member.address}">서울시 강남구</td>
            <td th:text="${member.phone}">010-1234-5678</td>
            <td>
                <a th:href="@{/members/edit/{id}(id=${member.memberId})}" class="btn btn-edit">수정</a>
                <a th:href="@{/members/delete/{id}(id=${member.memberId})}"
                   class="btn btn-delete"
                   onclick="return confirm('정말 삭제하시겠습니까?')">삭제</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(memberList)}">
            <td colspan="6" style="text-align: center;">등록된 회원이 없습니다.</td>
        </tr>
        </tbody>
    </table>
</div>

<div style="margin-top: 20px; text-align: center">
    <a th:href="@{/member/list(page=${page.number-1})}"
       th:if="${page.hasPrevious()}" style="margin-right: 10px">[이전]</a>

    <!-- ${#numbers.sequence(시작, 끝) -> 시작, 끝 반복 -->
    <span th:each="idx : ${#numbers.sequence(0, page.totalPages-1)}">
        <a th:href="@{/members/list(page=${idx})}"
           th:text="${idx +1}"
           th:style="${idx == page.number} ? 'font-weight:bold; color:blue' : '' "
           style="margin: 0 5px; text-decoration: none"></a>
    </span>

    <a th:href="@{/members/list(page=${page.number+1})}"
       th:if="${page.hasNext()}" style="margin-left: 10px">[다음]</a>
    </div>

</body>
</html>

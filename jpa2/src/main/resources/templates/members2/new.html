<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Member2 New</title>
    <style>
        body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:#f6f7fb; margin:0; padding:24px; color:#222; }
        .container { max-width: 720px; margin: 0 auto; }
        .card { background:#fff; border:1px solid #e6e8ef; border-radius:14px; box-shadow:0 8px 18px rgba(0,0,0,0.06); padding:18px; }

        h2 { margin:0 0 8px; font-size:20px; }
        .sub { color:#6b7280; font-size:13px; margin-bottom:14px; }

        .grid { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
        .field { display:flex; flex-direction:column; gap:6px; }
        label { font-size:13px; color:#374151; }
        input { border:1px solid #e5e7eb; border-radius:10px; padding:10px 12px; font-size:14px; outline:none; }
        input:focus { border-color:#93c5fd; box-shadow:0 0 0 3px rgba(59,130,246,0.15); }

        .actions { display:flex; gap:10px; justify-content:flex-end; margin-top:14px; }
        .btn { padding:10px 12px; border-radius:10px; font-size:14px; border:1px solid transparent; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:8px; }
        .btn-primary { background:#2563eb; color:#fff; }
        .btn-primary:hover { filter: brightness(0.95); }
        .btn-ghost { background:#fff; color:#374151; border-color:#e5e7eb; }
        .btn-ghost:hover { background:#f3f4f6; }

        .full { grid-column: 1 / -1; }
        .hint { font-size:12px; color:#6b7280; margin-top:2px; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h2>📝 Member2 신규 등록</h2>
        <div class="sub">필수값만 정확히 입력되게 만들고, 다음 단계에서 수정/삭제 붙이자.</div>

        <form th:action="@{/members2/new}" method="post">
            <div class="grid">
                <div class="field">
                    <label>이름 <span style="color:#ef4444;">*</span></label>
                    <input type="text" name="name" placeholder="예: 홍길동" required>
                </div>

                <div class="field">
                    <label>나이</label>
                    <input type="number" name="age" value="0" min="0" placeholder="예: 25">
                    <div class="hint">0 이상 숫자로 입력</div>
                </div>

                <div class="field full">
                    <label>주소 <span style="color:#ef4444;">*</span></label>
                    <input type="text" name="address" placeholder="예: 서울시 강남구 ..." required>
                </div>

                <div class="field full">
                    <label>전화번호</label>
                    <input type="text" name="phone" placeholder="예: 010-1234-5678">
                    <div class="hint">형식은 자유(나중에 검증 붙일 수 있어)</div>
                </div>
            </div>

            <div class="actions">
                <a class="btn btn-ghost" th:href="@{/members2/list}">← 목록</a>
                <button class="btn btn-primary" type="submit">저장하기</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
